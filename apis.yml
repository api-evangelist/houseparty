name: Houseparty
description: 'Houseparty was a face-to-face social networking and group video chat mobile app developed
  by Life on Air, Inc. Launched in 2016, it let up to eight friends video chat together in shared rooms
  and play built-in games such as Heads Up! and trivia. Epic Games acquired Houseparty in June 2019, and
  the service was discontinued in October 2021 with its team folded into Epic. Surfaced as a Greylock
  portfolio company, it is retained in the API Evangelist network as a historical consumer-social profile;
  the product is defunct and publishes no developer API, documentation, or SDKs.'
